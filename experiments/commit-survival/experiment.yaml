name: ojalgo-commit-survival

project:
  repo: /Users/donggi/_projects/experiment-projects/ojAlgo
  language: java
  build: maven
  module: .
  test_framework: junit5

anchor: "v53.1.1"                 # edde296e, 2023-10-16. Java 11 source level; the range stays on Java 11 (the Java 22 switch is at #389, outside the range)
range:
  branch: origin/develop          # the fork's only branch; its first-parent line equals upstream master for this range
  end: b05de1012920d851e4150a72d328e55156424f2b   # #300, 2026-07-19 "MIPLIB and other collections"
  mode: first-parent
  limit: null
  skip_untouched: main-sources    # 56 of the 300 commits change neither src/main nor pom.xml

scope:
  rule: explicit                  # change-ranked stops at SimplexSolver alone (ExpressionsBasedModel has 104 methods > 80 cap); chosen by hand instead
  rank_by: change-count
  min_methods: 3
  exclude_accessor_heavy: true
  target_methods: [50, 80]
  max_dev_scope: 400
  max_classes: 10
  classes:                        # public API class with its own developer tests. The four optimisation.linear solver classes chosen first
    - org.ojalgo.optimisation.ExpressionsBasedModel   # m 104, c 46; (SimplexSolver, SimplexStore, LinearSolver, RevisedStore) are package-private or abstract and
                                                      # LLM tests for them almost never compiled (KTester 19/73 files, Ouedraogo 1/40); replaced 2026-11-07 17:10
  min_classes: 1

dev:
  discovery: build                # developer candidates = methods the project's own `mvn test` runs (surefire includes **/*.java, excludedGroups slow,unstable,network)
  unmapped: exclude
  stable_runs: 1
  groups:
    - name: dev
      denominator: project
      frozen: false
    - name: dev-scope
      display: "Dev (scope)"
      denominator: coverage-scoped
      derive_from: dev

model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  env_key: OPENROUTER_API_KEY

generators:
  - name: ktester
    display: KTester
    method: ktester
    impl: author-tool
    tool_path: /Users/donggi/_projects/experiment-projects/KTester
    docker:
      compose_files:
        - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.yml
        - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.ojalgo.yml
      service: ktester
      mounts:
        /Users/donggi/_projects/experiment-projects/ojAlgo: /repo
        /Users/donggi/_projects/experiment-projects/KTester: /work
    params: {fix_tries: 3, temperature: 0.5, workers: 8}
    rounds: {max: 1}

  - name: ouedraogo
    display: Ouédraogo
    method: ouedraogo
    impl: native
    params: {prompts: [ZSL, FSL, CoT, ToT, GToT], temperature: 0.7, max_tokens: 16384}
    rounds: {max: 2, until_dev_matched: false, stop_after_zero_compile: 2}
    context:
      dependency_signatures: {enabled: true, max_types: 15, max_lines: 400}
    prompt:
      api_constraint: true
    postprocess:
      import_repair: {enabled: true, passes: 2}

screen:
  stable_runs: 1
  dedup: exact-body
  matching: none

survival:
  execution: batch                # one JVM per commit; survival and scope line coverage in one pass
  selection: all                  # affected gave no carry on ojAlgo (core changes touch every test) and serialises commits; all runs 6 commits concurrently
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns: ["java.net.BindException"]
    max_reruns: 3
    backoff_seconds: 5

coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering

runner:
  docker:
    image: survival-java:25
    mounts:
      /Users/donggi/_projects/experiment-projects/ojAlgo: /repo
    env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  javac_mode: reused-jvm
  reuse:
    checkouts: null
    classpath_cache: null
  workers: {build: 6, survive: 6, cover: 6}   # MacBook runs only this experiment this week (Docker 11.7 GB, 12 CPUs); survive chunk JVM peaks ~1.3 GB
  timeouts: {build: 600, compile: 300, test_class: 120}
  jvm: {launcher: 1g, javac: 512m, jacoco: 1g}
  cache: {classpath: pom-sha256, node_modules: lockfile-sha256}
